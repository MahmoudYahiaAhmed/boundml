[package]
name = "boundml-core"
description = "Graph IR, CPU kernels, reverse-mode autodiff, static tensor-memory planning and optimizers for small dense models (BoundML core)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["machine-learning", "autodiff", "neural-network", "memory-planning", "tabular"]
categories = ["science", "algorithms"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.154"
