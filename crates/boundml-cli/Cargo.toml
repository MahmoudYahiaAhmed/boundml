[package]
name = "boundml-cli"
default-run = "boundml"
description = "BoundML command-line tool: train small dense models from CSV, package them with their preprocessing, verify, compare, predict and serve locally."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["machine-learning", "cli", "inference", "tabular", "model-serving"]
categories = ["command-line-utilities", "science"]

[dependencies]
axum = "0.8.9"
boundml-artifact = { version = "0.1.0", path = "../boundml-artifact" }
boundml-core = { version = "0.1.0", path = "../boundml-core" }
boundml-data = { version = "0.1.0", path = "../boundml-data" }
boundml-train = { version = "0.1.0", path = "../boundml-train" }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["timeout", "limit"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "boundml"
path = "src/main.rs"
