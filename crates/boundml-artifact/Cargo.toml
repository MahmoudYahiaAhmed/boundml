[package]
name = "boundml-artifact"
description = "Versioned BoundML model packages: schema, fitted preprocessing, weights, self-tests, memory plan, embeddable Predictor and package comparison."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["machine-learning", "inference", "model-packaging", "safetensors", "embedded"]
categories = ["science"]

[dependencies]
boundml-core = { version = "0.1.0", path = "../boundml-core" }
boundml-data = { version = "0.1.0", path = "../boundml-data" }
hex = "0.4.3"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
