[package]
name = "boundml-data"
description = "Schema-checked numeric CSV input, train-only fitted preprocessing and bounded deterministic minibatch streaming for BoundML."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["machine-learning", "csv", "preprocessing", "tabular", "schema"]
categories = ["science", "parser-implementations"]

[dependencies]
boundml-core = { version = "0.1.0", path = "../boundml-core" }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
