<text x="405.5" y="25" fill="#9AA4AE" text-anchor="middle" style="opacity:1;font-size:12px">boundml demo - real output</text>
<clipPath id="c"><rect x="0" y="34" width="811" height="492"/></clipPath>
<g clip-path="url(#c)"><g class="scroll"><text class="l0" x="18" y="66" fill="#E6EDF3" xml:space="preserve"><tspan fill="#3DD9B3">$ </tspan>boundml --version</text><text class="l1" x="18" y="85" fill="#C9D1D9" xml:space="preserve">boundml 0.1.0 (revision 1f4146b7fe, x86_64-pc-windows-msvc)</text><text class="l2" x="18" y="104" fill="#E6EDF3" xml:space="preserve"><tspan fill="#3DD9B3">$ </tspan>boundml init demo</text><text class="l3" x="18" y="123" fill="#C9D1D9" xml:space="preserve">created example in demo:</text><text class="l4" x="18" y="142" fill="#C9D1D9" xml:space="preserve">  demo/model.toml</text><text class="l5" x="18" y="161" fill="#C9D1D9" xml:space="preserve">  demo/data/train.csv</text><text class="l6" x="18" y="180" fill="#C9D1D9" xml:space="preserve">  demo/data/valid.csv</text><text class="l7" x="18" y="199" fill="#C9D1D9" xml:space="preserve">  demo/data/test.csv</text><text class="l8" x="18" y="218" fill="#C9D1D9" xml:space="preserve">next: boundml validate demo/model.toml</text><text class="l9" x="18" y="237" fill="#E6EDF3" xml:space="preserve"><tspan fill="#3DD9B3">$ </tspan>boundml train demo/model.toml --checkpoint demo/ckpt --quiet</text><text class="l10" x="18" y="256" fill="#C9D1D9" xml:space="preserve">training complete after 1890 steps in 0.16s; checkpoint: demo/ckpt</text><text class="l11" x="18" y="275" fill="#C9D1D9" xml:space="preserve">final epoch: train_loss=0.03957  valid: mae=0.1527 mse=0.0366 r2=0.9954 rmse=0.1913</text><text class="l12" x="18" y="294" fill="#E6EDF3" xml:space="preserve"><tspan fill="#3DD9B3">$ </tspan>boundml evaluate demo/ckpt --data demo/data/test.csv</text><text class="l13" x="18" y="313" fill="#C9D1D9" xml:space="preserve">metrics on demo/data/test.csv:</text><text class="l14" x="18" y="332" fill="#C9D1D9" xml:space="preserve">  mae            0.1465   (constant baseline 2.2394)</text><text class="l15" x="18" y="351" fill="#C9D1D9" xml:space="preserve">  mse            0.0352   (constant baseline 11.0583)</text><text class="l16" x="18" y="370" fill="#C9D1D9" xml:space="preserve">  r2             0.9968   (constant baseline -0.0071)</text><text class="l17" x="18" y="389" fill="#C9D1D9" xml:space="preserve">  rmse           0.1877   (constant baseline 3.3254)</text><text class="l18" x="18" y="408" fill="#C9D1D9" xml:space="preserve">  rows         400.0000   (constant baseline 400.0000)</text><text class="l19" x="18" y="427" fill="#E6EDF3" xml:space="preserve"><tspan fill="#3DD9B3">$ </tspan>boundml pack demo/ckpt --out demo/model.boundml</text><text class="l20" x="18" y="446" fill="#C9D1D9" xml:space="preserve">packed &#x27;example-regression&#x27; -&gt; demo/model.boundml (17 synthetic self-test vectors, verified </text><text class="l21" x="18" y="465" fill="#C9D1D9" xml:space="preserve">after write)</text><text class="l22" x="18" y="484" fill="#E6EDF3" xml:space="preserve"><tspan fill="#3DD9B3">$ </tspan>boundml predict demo/model.boundml --data demo/data/test.csv --out demo/pred.csv --preview 3</text><text class="l23" x="18" y="503" fill="#C9D1D9" xml:space="preserve">wrote 400 predictions to demo/pred.csv in 0.001s</text><text class="l24" x="18" y="522" fill="#C9D1D9" xml:space="preserve">  line   power</text><text class="l25" x="18" y="541" fill="#C9D1D9" xml:space="preserve">     2  4.5001</text><text class="l26" x="18" y="560" fill="#C9D1D9" xml:space="preserve">     3  6.3667</text><text class="l27" x="18" y="579" fill="#C9D1D9" xml:space="preserve">     4  7.7849</text><text class="l28" x="18" y="598" fill="#E6EDF3" xml:space="preserve"><tspan fill="#3DD9B3">$ </tspan>boundml plan demo/model.toml --mode infer --tensor-budget 64KiB</text><text class="l29" x="18" y="617" fill="#FFB4A8" xml:space="preserve">error: BML-C005 tensor budget exceeded: plan needs 68228 bytes but the budget is 65536 </text><text class="l30" x="18" y="636" fill="#FFB4A8" xml:space="preserve">bytes; largest contributors: arena x 2 session(s) (65536 bytes), shared weights (2692 </text><text class="l31" x="18" y="655" fill="#FFB4A8" xml:space="preserve">bytes), dense0.act (16384 bytes), dense0.matmul (16384 bytes), dense0.pre (16384 bytes)</text><text class="l32" x="18" y="674" fill="#9AA4AE" xml:space="preserve">[exit code 4]</text></g></g>
