<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">BoundML mark: a small dense network inside a bounded frame</title>
  <rect width="128" height="128" rx="28" fill="#16191D"/>
  <!-- the bound: four corner brackets -->
  <g fill="none" stroke="#3DD9B3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 44 V22 H44"/><path d="M84 22 H106 V44"/>
    <path d="M106 84 V106 H84"/><path d="M44 106 H22 V84"/>
  </g>
  <!-- dense layers 2 -> 3 -> 1 -->
  <g stroke="#8FF0D7" stroke-width="2.4" stroke-opacity="0.55">
    <path d="M42 50 L64 40 M42 50 L64 64 M42 50 L64 88 M42 78 L64 40 M42 78 L64 64 M42 78 L64 88"/>
    <path d="M64 40 L86 64 M64 64 L86 64 M64 88 L86 64"/>
  </g>
  <g fill="#E6EDF3">
    <circle cx="42" cy="50" r="6"/><circle cx="42" cy="78" r="6"/>
    <circle cx="64" cy="40" r="6"/><circle cx="64" cy="64" r="6"/><circle cx="64" cy="88" r="6"/>
  </g>
  <circle cx="86" cy="64" r="7.5" fill="#3DD9B3"/>
</svg>
