# Uploads the wheels attached to a published GitHub release to PyPI (boundml-rs),
# using PyPI trusted publishing: no token is stored. The PyPI project must list this
# repository, this workflow file and the `pypi` environment as a trusted publisher.
name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose wheels to upload (for example v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # OIDC token for PyPI trusted publishing
    steps:
      - name: Download the release's wheels and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "*.whl" --pattern "*.whl.sha256" --dir dist
          cd dist && cat *.whl.sha256 && sha256sum -c *.whl.sha256 && rm *.sha256 && ls -l
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
