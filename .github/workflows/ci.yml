# Linux, Windows and macOS. First fully green run: 2026-10-24, commit fbad6db
# (run 40032964857); see docs/release-status.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --release --workspace --locked
      - name: Walkthrough smoke test
        shell: bash
        run: |
          B=target/release/boundml
          $B init out/smoke
          $B validate out/smoke/model.toml
          $B train out/smoke/model.toml --checkpoint out/smoke/ckpt --quiet
          $B pack out/smoke/ckpt --out out/smoke/model.boundml
          $B verify out/smoke/model.boundml
          $B predict out/smoke/model.boundml --data out/smoke/data/test.csv --out out/smoke/pred.csv
          target/release/boundml-embed-example out/smoke/model.boundml temperature=20 humidity= load=0.5

  package-smoke:
    # Builds the release archive for this platform and tests the extracted archive.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/release.py --out dist

  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install tensorflow-cpu keras safetensors numpy
      - run: cargo build --release --locked -p boundml-cli
      - run: python migrate/check_migration.py

  python:
    # Builds the `boundml` wheel and runs its tests, including bitwise parity with the CLI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo fmt --manifest-path python/Cargo.toml --check
      - run: cargo clippy --manifest-path python/Cargo.toml --locked -- -D warnings
      - run: cargo build --release --locked -p boundml-cli
      - run: pip install maturin pytest pandas numpy
      - name: Build and install the wheel
        shell: bash
        run: |
          maturin build --release --locked --manifest-path python/Cargo.toml --out wheels
          pip install --no-index --find-links wheels boundml
      - run: python -m pytest python/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheels/*.whl
