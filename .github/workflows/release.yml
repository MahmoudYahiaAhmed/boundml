# On a version tag: builds the CLI archives and Python wheels for each platform,
# smoke-tests the extracted archive and the installed wheel, and creates a DRAFT
# GitHub pre-release with every file and SHA256SUMS. A maintainer reviews and
# publishes the draft; the PyPI upload is a separate workflow (publish-pypi.yml).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build, package, checksum and smoke-test the archive
        run: python scripts/release.py --target ${{ matrix.target }} --out dist
      - name: Build the Python wheel (boundml-rs)
        shell: bash
        run: |
          pip install maturin pytest pandas numpy
          maturin build --release --locked --manifest-path python/Cargo.toml --out dist
      - name: Install the wheel and run its tests (CLI parity against the release binary)
        shell: bash
        run: |
          cargo build --release --locked -p boundml-cli
          pip install --no-index --find-links dist boundml-rs
          python -m pytest python/tests -q
      - name: Wheel checksums (LF line endings on every platform)
        shell: bash
        run: |
          cd dist
          for w in *.whl; do
            python -c 'import hashlib, sys; p = sys.argv[1]; d = hashlib.sha256(open(p, "rb").read()).hexdigest(); open(p + ".sha256", "w", newline="\n").write(f"{d}  {p}\n")' "$w"
            cat "$w.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.whl
            dist/*.sha256
            dist/smoke-*.json

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the draft release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && cat *.sha256 | sort > SHA256SUMS && cat SHA256SUMS && sha256sum -c SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease \
            --title "BoundML $GITHUB_REF_NAME (early beta)" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" \
            dist/*.zip dist/*.tar.gz dist/*.whl dist/*.sha256 dist/SHA256SUMS
