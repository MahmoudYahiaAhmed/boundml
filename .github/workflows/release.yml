# Builds release archives on a version tag and creates a DRAFT GitHub release.
# Nothing is published automatically: a maintainer reviews and publishes the draft.
# As of 2026-10-23 this workflow has NOT been observed running.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build, package, checksum and smoke-test the archive
        run: python scripts/release.py --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/smoke-*.json

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the draft release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && cat *.sha256 | sort > SHA256SUMS && cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease \
            --title "BoundML $GITHUB_REF_NAME (early release)" \
            --notes-file "launch/release-notes-$GITHUB_REF_NAME.md" \
            dist/*.zip dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS
