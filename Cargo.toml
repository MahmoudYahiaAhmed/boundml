[workspace]
resolver = "2"
members = ["bench", "crates/*", "examples/embed", "examples/power-app"]
exclude = ["python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MahmoudYahiaAhmed/boundml"
homepage = "https://github.com/MahmoudYahiaAhmed/boundml"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 1
