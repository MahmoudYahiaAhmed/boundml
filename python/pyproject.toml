[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "boundml"
version = "0.1.0"
description = "Train and run small numeric models with their schema, preprocessing and memory plan packaged together (native Rust core)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["numpy>=1.21"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/MahmoudYahiaAhmed/boundml"
Documentation = "https://github.com/MahmoudYahiaAhmed/boundml/blob/main/python/README.md"
Issues = "https://github.com/MahmoudYahiaAhmed/boundml/issues"

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
test = ["pytest>=7", "pandas>=1.3"]

[tool.maturin]
python-source = "."
module-name = "boundml._native"
features = ["pyo3/extension-module"]
include = [{ path = "LICENSE-*", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
